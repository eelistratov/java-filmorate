# ????????? ??????????? Logbook
logging.level.org.zalando.logbook=TRACE
logging.level.ru.yandex.practicum.filmorate=DEBUG

# ?????????????? ????????? Logbook
logbook.include.request.body=true
logbook.include.response.body=true
logbook.filter.enabled=true
logbook.format.json=true

# ?????? ?????
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# ????????? ???? ?????? H2

# ????? ??????: always - ?????? ????????? schema.sql ??? ???????
spring.sql.init.mode=always

# URL ??????????? ? ?? (???? ?? ?????)
spring.datasource.url=jdbc:h2:file:./db/filmorate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# ??????? H2
spring.datasource.driverClassName=org.h2.Driver

# ????? ? ?????? (?? ????????? ??? H2)
spring.datasource.username=sa
spring.datasource.password=password

# ????????? ???? ??????????
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ????????? SQL-????????

# ???? ? ????? schema.sql (?? ????????? schema.sql)
spring.sql.init.schema-locations=classpath:schema.sql

# ???? ? ????? data.sql (????????? ??????)
spring.sql.init.data-locations=classpath:data.sql

# ?????????? ?????????? ??? ???????
spring.sql.init.continue-on-error=false

# ????????? H2 ??????? (??? ???????)

# ???????? H2 ???????
spring.h2.console.enabled=true

# ???? ? H2 ???????
spring.h2.console.path=/h2-console

# ????????? ?????? ? H2 ??????? ????? (?????? ??? ??????????!)
spring.h2.console.settings.web-allow-others=true

# ???????? ??????????? ??? ??????? H2
spring.h2.console.settings.trace=true

# ????????? ??????????? SQL

# ?????????? SQL-???????
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.org.h2=DEBUG